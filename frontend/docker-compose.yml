services:
  postgres:
    image: postgres:17

    container_name: aibispro-postgres

    restart: always

    environment:
      POSTGRES_USER: aibispro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aibispro_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: