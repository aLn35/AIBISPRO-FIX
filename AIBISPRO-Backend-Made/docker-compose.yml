services:
  postgres:
    image: postgres:17

    container_name: aibispro-postgres

    restart: always

    environment:
      POSTGRES_USER: aibispro
      POSTGRES_PASSWORD: aibispro123
      POSTGRES_DB: aibispro_db
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: