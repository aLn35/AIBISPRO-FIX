services:
  postgres:
    image: postgres:17

    container_name: aibispro-postgres

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in AIBISPRO-Backend-Made/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in AIBISPRO-Backend-Made/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in AIBISPRO-Backend-Made/.env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: